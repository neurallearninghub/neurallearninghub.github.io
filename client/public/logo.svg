<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="genFlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="genFlow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="genCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="genGlow">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Generative particle streams flowing outward -->
  <g opacity="0.6">
    <circle cx="30" cy="15" r="1.2" fill="#ec4899">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="12" r="0.8" fill="#a855f7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="10" r="0.6" fill="#6366f1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="32" cy="24" r="1" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="37" cy="24" r="0.7" fill="#3b82f6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="30" cy="33" r="1.2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="36" r="0.8" fill="#ec4899">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="18" cy="33" r="1.2" fill="#fbbf24">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="13" cy="36" r="0.8" fill="#f97316">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="16" cy="24" r="1" fill="#a855f7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="11" cy="24" r="0.7" fill="#6366f1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="18" cy="15" r="1.2" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="13" cy="12" r="0.8" fill="#3b82f6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Flowing energy paths (generative streams) -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M 24 24 Q 28 18 32 14" fill="none" stroke="url(#genFlow1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 24 Q 30 24 36 24" fill="none" stroke="url(#genFlow2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 24 Q 28 30 32 34" fill="none" stroke="url(#genFlow1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 24 Q 20 30 16 34" fill="none" stroke="url(#genFlow2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 24 Q 18 24 12 24" fill="none" stroke="url(#genFlow1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 24 Q 20 18 16 14" fill="none" stroke="url(#genFlow2)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Neural network ring (AI processing) -->
  <circle cx="24" cy="24" r="10" fill="none" stroke="url(#genFlow1)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="24" cy="24" r="8" fill="none" stroke="url(#genFlow2)" stroke-width="1" opacity="0.5"/>
  
  <!-- Generative AI core (the creative engine) -->
  <circle cx="24" cy="24" r="7" fill="url(#genGlow)"/>
  <circle cx="24" cy="24" r="6" fill="url(#genCore)" filter="url(#glow)"/>
  
  <!-- Inner creativity symbol (AI brain) -->
  <g opacity="0.9">
    <circle cx="24" cy="24" r="4" fill="#fff" opacity="0.3"/>
    <path d="M 24 20 L 24 28" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 20 24 L 28 24" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="24" cy="20" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="28" cy="24" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="24" cy="28" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="20" cy="24" r="1.5" fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- Central bright point (generation origin) -->
  <circle cx="24" cy="24" r="1.5" fill="#fff" opacity="0.95">
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>